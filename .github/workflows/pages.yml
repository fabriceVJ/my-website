# Publishes the static site to GitHub Pages on every push to main.
# No build step: the site files are copied as-is into the Pages artifact.
# Only the files listed under "Collect site files" go live. Repo-only files
# (openspec/, .claude/, README.md, …) are never published.
#
# One-time setup: GitHub → Settings → Pages → Source: "GitHub Actions",
# and Custom domain: fabrice-vj.ch (Enforce HTTPS on).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a running one mid-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html style.css CNAME .nojekyll _site/
          cp -r media _site/media

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
